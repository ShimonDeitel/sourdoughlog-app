name: SourdoughLog
options:
  bundleIdPrefix: com.shimondeitel.sourdoughlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  SourdoughLog:
    type: application
    platform: iOS
    sources:
      - path: SourdoughLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.sourdoughlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SourdoughLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  SourdoughLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SourdoughLogTests
      - path: SourdoughLog.storekit
    dependencies:
      - target: SourdoughLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.sourdoughlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  SourdoughLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SourdoughLogUITests
    dependencies:
      - target: SourdoughLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.sourdoughlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SourdoughLog:
    build:
      targets:
        SourdoughLog: all
        SourdoughLogTests: [test]
        SourdoughLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SourdoughLog.storekit
    test:
      config: Debug
      storeKitConfiguration: SourdoughLog.storekit
      targets:
        - SourdoughLogTests
        - SourdoughLogUITests
    archive:
      config: Release
